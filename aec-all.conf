# aec-all.conf: a PipeWire client process (pipewire -c aec-all.conf) with
# one echo canceller in monitor mode: its reference is the monitor of the
# Schiit DAC (everything the speakers play: music, 079, the rest), its
# capture the raw MG-XU mic, its output the source voice079_mic_all.
# Nothing is routed through it and no playback changes (the person: "don't
# touch my audio"); it only listens.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            audio.channels = 1
            capture.props = {
                node.name = "voice079_all_capture"
                target.object = "alsa_input.usb-Yamaha_Corporation_MG-XU-00.analog-stereo"
                node.passive = true
            }
            source.props = {
                node.name = "voice079_mic_all"
                node.description = "Voice 079 mic, everything playing cancelled"
            }
            sink.props = {
                node.name = "voice079_all_reference"
                target.object = "alsa_output.usb-Schiit_Audio_Schiit_Modi_3_-00.analog-stereo"
                node.passive = true
            }
        }
    }
]
